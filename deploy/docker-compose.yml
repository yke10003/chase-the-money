name: nolume

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nolume-api
    container_name: nolume-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - api-storage:/var/www/html/storage
      - api-db:/var/www/html/database
    networks:
      - edge

  web:
    image: nginx:1.27-alpine
    container_name: nolume-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

networks:
  edge:
    external: true
    name: gb-edge

volumes:
  api-storage:
  api-db:
